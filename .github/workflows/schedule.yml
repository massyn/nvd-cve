name: Daily Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set git user
      run: |
        git config --global user.name "massyn"
        git config --global user.email "phil.massyn@icloud.com"

    - name: Run sync script
      run: python sync_database.py
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: Commit changes
      run: |
        git add database/
        if [ -n "$(git status --porcelain -- database/)" ]; then
          date=$(date +'%Y-%m-%d %H:%M:%S')
          git commit -m "Automated commit: Update CVE database at $date"
        else
          echo "No changes to commit."
        fi

    - name: Push changes
      run: |
        if [ -n "$(git log origin/main..HEAD)" ]; then
          git push origin main
        else
          echo "Nothing to push."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run process script
      run: python process_database.py

    - name: Build website
      run: python website.py

    - name: Publish to CloudFlare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: cve-db
        directory: './dist'