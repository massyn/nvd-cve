name: Daily Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set git user
      run: |
        git config --global user.name "massyn"
        git config --global user.email "phil.massyn@icloud.com"

    - name: Run sync script
      run: python sync_database.py
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: Commit changes
      id: commit
      run: |
        git add database/
        if [ -n "$(git status --porcelain -- database/)" ]; then
          date=$(date +'%Y-%m-%d %H:%M:%S')
          git commit -m "Automated commit: Update CVE database at $date"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "No changes to commit."
        fi

    - name: Push changes
      if: steps.commit.outputs.changed == 'true'
      run: git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run process script
      if: steps.commit.outputs.changed == 'true'
      run: python process_database.py

    - name: Build website
      if: steps.commit.outputs.changed == 'true'
      run: python website.py

    - name: Publish to CloudFlare Pages
      if: steps.commit.outputs.changed == 'true'
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: cve-db
        directory: './dist'